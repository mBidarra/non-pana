[package]
name = "novo-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dom_smoothie = "0.18.2"
htmd = "0.5.6"
novo-core = { version = "0.1.0", path = "../novo-core" }
