[package]
name = "novo-index"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
novo-core = { version = "0.1.0", path = "../novo-core" }
novo-graph = { version = "0.1.0", path = "../novo-graph" }
novo-memory = { version = "0.1.0", path = "../novo-memory" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
