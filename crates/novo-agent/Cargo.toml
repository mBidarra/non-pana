[package]
name = "novo-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
hex = "0.4.3"
novo-core = { version = "0.1.0", path = "../novo-core" }
novo-memory = { version = "0.1.0", path = "../novo-memory" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
