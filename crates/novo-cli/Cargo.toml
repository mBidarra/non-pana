[package]
name = "novo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
novo-agent = { version = "0.1.0", path = "../novo-agent" }
novo-core = { version = "0.1.0", path = "../novo-core" }
novo-focus = { version = "0.1.0", path = "../novo-focus" }
novo-graph = { version = "0.1.0", path = "../novo-graph" }
novo-index = { version = "0.1.0", path = "../novo-index" }
novo-ingest = { version = "0.1.0", path = "../novo-ingest" }
novo-service = { version = "0.1.0", path = "../novo-service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
