reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "charset", "http2"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
whatlang = "0.18.0"
