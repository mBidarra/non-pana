[package]
name = "novo-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
futures-util = "0.3.34"
mime_guess = "2.0.5"
notify = "8.2.1"
novo-agent = { version = "0.1.0", path = "../novo-agent" }
novo-core = { version = "0.1.0", path = "../novo-core" }
novo-focus = { version = "0.1.0", path = "../novo-focus" }
novo-graph = { version = "0.1.0", path = "../novo-graph" }
novo-index = { version = "0.1.0", path = "../novo-index" }
novo-ingest = { version = "0.1.0", path = "../novo-ingest" }
novo-memory = { version = "0.1.0", path = "../novo-memory" }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
